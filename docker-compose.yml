services:
  # 1. Base de datos Espacial PostgreSQL 16 con PostGIS 3.4
  db:
    image: postgis/postgis:16-3.4
    container_name: willai_db
    restart: always
    environment:
      POSTGRES_DB: alerta_incendios_coracora
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alerta_incendios_coracora"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Broker de Mensajes y Caché en memoria Redis 7
  redis:
    image: redis:7-alpine
    container_name: willai_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. Backend API REST Django (Python 3.11 + GeoDjango / GDAL + Gunicorn)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: willai_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DJANGO_ENV: development
      DEBUG: "True"
      SECRET_KEY: django-insecure-willai-docker-secret-key-2026
      ALLOWED_HOSTS: "*"
      CORS_ALLOW_ALL_ORIGINS: "True"
      DB_ENGINE: django.contrib.gis.db.backends.postgis
      DB_NAME: alerta_incendios_coracora
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_HOST: db
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "False"
      NASA_FIRMS_MAP_KEY: a84d23a9aab653f18f15991290bd093e
      SERFOR_API_URL: https://geo.serfor.gob.pe
      OPEN_METEO_API_URL: https://api.open-meteo.com/v1/forecast
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Celery Worker (Tareas asíncronas NASA FIRMS, Open-Meteo, SERFOR y FWI)
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: willai_celery_worker
    restart: always
    command: celery -A config worker --loglevel=info
    environment:
      DJANGO_ENV: development
      DEBUG: "True"
      SECRET_KEY: django-insecure-willai-docker-secret-key-2026
      ALLOWED_HOSTS: "*"
      CORS_ALLOW_ALL_ORIGINS: "True"
      DB_ENGINE: django.contrib.gis.db.backends.postgis
      DB_NAME: alerta_incendios_coracora
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_HOST: db
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "False"
      NASA_FIRMS_MAP_KEY: a84d23a9aab653f18f15991290bd093e
      SERFOR_API_URL: https://geo.serfor.gob.pe
      OPEN_METEO_API_URL: https://api.open-meteo.com/v1/forecast
    volumes:
      - media_data:/app/media
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  # 5. Celery Beat (Planificador recurrente de sincronización satelital y climática)
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: willai_celery_beat
    restart: always
    command: celery -A config beat --loglevel=info
    environment:
      DJANGO_ENV: development
      DEBUG: "True"
      SECRET_KEY: django-insecure-willai-docker-secret-key-2026
      ALLOWED_HOSTS: "*"
      CORS_ALLOW_ALL_ORIGINS: "True"
      DB_ENGINE: django.contrib.gis.db.backends.postgis
      DB_NAME: alerta_incendios_coracora
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_HOST: db
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "False"
      NASA_FIRMS_MAP_KEY: a84d23a9aab653f18f15991290bd093e
      SERFOR_API_URL: https://geo.serfor.gob.pe
      OPEN_METEO_API_URL: https://api.open-meteo.com/v1/forecast
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  # 6. Centro de Mando Táctico Web (React + Vite SPA servido con Nginx Reverse Proxy)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: willai_frontend
    restart: always
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
  redisdata:
  media_data:
  static_data:

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: willai_db
    restart: always
    environment:
      POSTGRES_DB: alerta_incendios_coracora
      POSTGRES_USER: willai_user
      POSTGRES_PASSWORD: willai_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U willai_user -d alerta_incendios_coracora"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: willai_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:

name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Production / Preview APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: |
          npm ci || npm install --legacy-peer-deps

      - name: Setup google-services.json
        run: |
          if [ ! -f google-services.json ] && [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "Restaurando google-services.json desde secret..."
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > google-services.json
          elif [ -f google-services.json ]; then
            echo "google-services.json verificado en el repositorio."
          else
            echo "Advertencia: google-services.json no encontrado y secret no configurado."
          fi

      - name: Generate Android native project (Expo Prebuild)
        run: |
          npx expo prebuild --platform android --no-install

      - name: Configure debug signing for Release APK
        run: |
          node -e '
            const fs = require("fs");
            const file = "android/app/build.gradle";
            if (fs.existsSync(file)) {
              let content = fs.readFileSync(file, "utf8");
              content = content.replace(/signingConfig\s+signingConfigs\.release/g, "signingConfig signingConfigs.debug");
              if (!content.includes("signingConfig signingConfigs.debug")) {
                content = content.replace(/buildTypes\s*\{\s*release\s*\{/g, "buildTypes {\n        release {\n            signingConfig signingConfigs.debug");
              }
              fs.writeFileSync(file, content, "utf8");
              console.log("Configuración de firma debug aplicada a build.gradle");
            }
          '

      - name: Build Release APK with Gradle
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m"
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WillAI-Android-APK
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
